################################################################################
# FILE: ~/.config/hypr/modules/keybindings.conf
################################################################################

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$browser = zen-browser

################################################################################
# APPLICATIONS
################################################################################

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, A, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, firefox
bind = $mainMod, W, exec, ~/.local/bin/wallpaper-switcher.sh
bind = $mainMod SHIFT, W, exec, brave --app=https://web.whatsapp.com
bind = $mainMod, D, exec, discord
bind = $mainMod, P, exec, postman
bind = $mainMod, R, exec, /home/syraxdev/Applications/requestly.AppImage
bind = $mainMod, C, exec, codium --ozone-platform=wayland
bind = $mainMod SHIFT, C, exec, code
bind = $mainMod, SPACE, exec, ~/.config/waybar/launch.sh
bind = $mainMod, O, exec, obsidian
bind = , XF86Calculator, exec, gnome-calculator
bind = $mainMod, G, exec, antigravity
bind = $mainMod SHIFT, G, exec, ~/Applications/Antigravity\ IDE/antigravity-ide

################################################################################
# ROFI
################################################################################

bind = CTRL SHIFT, E, exec, rofi -show emoji -modi emoji

################################################################################
# WAYBAR Toggle
################################################################################

bind = SUPER, M, exec, ~/.local/bin/toggle-waybar

################################################################################
# WINDOW MANAGEMENT
################################################################################

bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, V, togglefloating
bind = $mainMod, T, pin
bind = $mainMod SHIFT, P, exit

################################################################################
# GROUP MANAGEMENT
################################################################################

bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

################################################################################
# FOCUS MOVEMENT
################################################################################

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# bind = $mainMod, H, movefocus, l
# bind = $mainMod, L, movefocus, r
# bind = $mainMod, K, movefocus, u
# bind = $mainMod, J, movefocus, d

################################################################################
# MOVE WINDOWS
################################################################################

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

################################################################################
# RESIZE WINDOWS
################################################################################

bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

################################################################################
# WORKSPACES
################################################################################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

################################################################################
# SPECIAL WORKSPACE
################################################################################

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

################################################################################
# WORKSPACE NAVIGATION
################################################################################

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1

################################################################################
# MOUSE
################################################################################

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

################################################################################
# SYSTEM
################################################################################

bind = $mainMod SHIFT, Escape, exec, systemctl suspend
bind = CTRL ALT, Delete, exec, ~/.config/rofi/powermenu.sh

################################################################################
# SCREENSHOTS
################################################################################

bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod, Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

################################################################################
# AUDIO / SWAYOSD
################################################################################

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +2
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -2
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

bindl  = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bindl  = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl  = , XF86AudioPause, exec, swayosd-client --playerctl pause
bindl  = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl  = , XF86AudioPrev, exec, swayosd-client --playerctl prev

################################################################################
# BRIGHTNESS / SWAYOSD
################################################################################

bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

################################################################################
# LOCK KEY OSD
################################################################################

bindr = , Caps_Lock, exec, sh -c "sleep 0.1 && swayosd-client --caps-lock-led input5::capslock"
bindr = , Num_Lock, exec, swayosd-client --num-lock

################################################################################
# CLIPBOARD
################################################################################

bind = $mainMod, N, exec, ~/.config/rofi/clipboard.sh

################################################################################
# LOCK SCREEN
################################################################################

bind = $mainMod, L, exec, hyprlock