################################################################################
# FILE: ~/.config/hypr/modules/windowrules.conf
################################################################################
# Window rules
# New syntax: windowrule = match:property value, effect value
# Or named blocks with windowrule { ... }

# Float specific windows
windowrule = match:class pavucontrol, float on
windowrule = match:class blueman-manager, float on
windowrule = match:class nm-connection-editor, float on
windowrule = match:class nwg-look, float on
windowrule = match:class qt5ct, float on
windowrule = match:class qt6ct, float on
windowrule = match:class gsimplecal, float on
windowrule = match:title File Operation Progress, float on

# Picture-in-Picture
windowrule {
  name = pip
  match:title = Picture-in-Picture
  float = true
  pin = true
  move = "75% 75%"
  size = "24% 24%"
}

# Firefox sharing indicator
windowrule = match:title Firefox — Sharing Indicator, workspace special:silent
windowrule = match:title .*is sharing (your screen|a window)\., workspace special:silent

## Opacity Rules
# windowrulev = opacity 0.3 0.3,class:^(.*)$
# windowrule = match:class Spotify, opacity 0.2
# # Opacity rules (commented out)
# windowrule = match:class .*, opacity 0.9
# windowrule = match:class kitty, opacity 1
# windowrule = match:class Alacritty, opacity 0.90 0.90
# windowrule = match:class Code, opacity 0.90 0.90
# windowrule = match:class firefox, opacity 1.0 override 1.0 override
# windowrule = match:class chromium, opacity 1.0 override 1.0 override

# Workspace assignments
windowrule = match:class antigravity, workspace 1
windowrule = match:class com\.anthropic\.Claude, workspace 1

windowrule = match:class obsidian, workspace 2

windowrule = match:class Postman, workspace 3
windowrule = match:class requestly-api-client, workspace 3

windowrule = match:class kitty, workspace 4

windowrule = match:class antigravity-ide, workspace 5
windowrule = match:class code, workspace 5
windowrule = match:class codium, workspace 5


windowrule = match:class zen, workspace 6
windowrule = match:class firefox, workspace 6
# windowrule = match:class brave-browser, workspace 6
# windowrule = match:class google-chrome, workspace 6

windowrule = match:class discord, workspace 7

windowrule = match:class Spotify, workspace 8

windowrule = match:class steam, workspace 9

# Size rules
windowrule {
  name = size
  match:class = pavucontrol
  size = 800 600
  center = on
}

# Maximize specific windows
windowrule = match:class libreoffice, maximize on

# No blur for certain windows
windowrule = match:class firefox, no_blur on

# Idle inhibit
windowrule = match:class mpv, idle_inhibit focus
windowrule = match:class firefox, idle_inhibit fullscreen

# XWayland apps (force scaling)
windowrule = match:xwayland 1, rounding 0


# Spotify – sane floating size
windowrule {
    name = Spotify
    match:class = Spotify
    workspace = 5
    size = 70% 85%
    center = on
    rounding = 16
    opacity = 0.75
}