################################################################################
# FILE: ~/.config/hypr/modules/workspaces.conf
################################################################################

# Workspace rules

# Persistent workspaces
workspace = 1, persistent:true
workspace = 2, persistent:true

# Per-monitor workspaces (example)
# workspace = 1, monitor:DP-1
# workspace = 2, monitor:DP-1
# workspace = 11, monitor:HDMI-A-1
# workspace = 12, monitor:HDMI-A-1

# Default workspace on specific monitor
# workspace = name:main, monitor:DP-1, default:true

# Workspace with gaps
# workspace = 3, gapsout:20, gapsin:10

# Workspace with specific border
# workspace = 4, bordersize:4

# Workspace with no rounding
# workspace = 5, rounding:false

# Special workspace
workspace = special:magic, gapsout:20, gapsin:10, bordersize:3, border:true, shadow:true
