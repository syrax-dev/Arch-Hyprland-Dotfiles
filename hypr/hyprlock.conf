# ##################################################
# ########   Syrax's Hyprlock Config   ##############
# ##################################################

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.8
    vibrancy = 0.2
}

# Profile Image
image {
    monitor =
    path = ~/.config/hypr/profile.png
    size = 120
    rounding = 100
    border_size = 2
    border_color = rgba(139, 92, 246, 1.0)

    position = 0, 120
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = syraxdev
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 70
    font_family = JetBrainsMono Nerd Font

    position = 0, -40
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(200, 200, 200, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, -90
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(139, 92, 246, 1.0)
    inner_color = rgba(30, 29, 47, 0.8)
    font_color = rgba(255, 255, 255, 1.0)

    rounding = 12
    fade_on_empty = false

    placeholder_text = 

    position = 0, -160
    halign = center
    valign = center
}