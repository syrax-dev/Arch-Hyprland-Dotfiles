# ===============================
# CATPPUCCIN MOCHA (SOURCE OF TRUTH)
# ===============================
include themes/theme.conf


# ===============================
# FONT (matches VSCodium)
# ===============================
font_family      JetBrainsMono Nerd Font Propo
italic_font      auto
bold_font        auto
bold_italic_font auto
font_size        12.5
font_family      JetBrainsMono Nerd Font
symbol_map       U+1F300-U+1FAFF Noto Color Emoji


# ===============================
# WINDOW APPEARANCE (VS CODE FEEL)
# ===============================
window_padding_width 14
window_margin_width 10
window_border_width 1

# Borders already come from theme.conf
# active_border_color / inactive_border_color handled there


# ===============================
# CURSOR (SMOOTH & MODERN)
# ===============================
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0


# ===============================
# BACKGROUND (NO FAKE TRANSPARENCY)
# ===============================
background_opacity 0.1
dynamic_background_opacity yes


# ===============================
# SCROLLBACK & PERFORMANCE
# ===============================
scrollback_lines 5000
scrollbar_handle_opacity 0
scrollbar_tack_opacity 0
scrollbar_track_hover_opacity 0
repaint_delay 10
input_delay 3
sync_to_monitor no


# ===============================
# TAB BAR (MATCHES VSCODIUM)
# ===============================
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
tab_title_template "{index}: {title}"


# ===============================
# WINDOW BEHAVIOR
# ===============================
remember_window_size no
initial_window_width 640
initial_window_height 480
hide_window_decorations yes
confirm_os_window_close 0


# ===============================
# WAYLAND / HYPRLAND FRIENDLY
# ===============================
enable_audio_bell no
visual_bell_duration 0.0
term xterm-kitty
allow_remote_control yes


disable_ligatures no
enable_audio_bell no
shell zsh
shell_integration disabled
cursor_shape block
url_style curly

# ===============================
# CURSOR TRAIL
# ===============================
cursor_trail 1
cursor_trail_decay 0.1 0.5     
cursor_blink_interval 0        
cursor_shape block              
cursor_beam_thickness 1.2
cursor_underline_thickness 2.0
